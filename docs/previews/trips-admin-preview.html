/* ---------- seeded demo data (all invented) ---------- */
const rnd=(function(s){return function(){s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}})(APP.seed);

const fdt=t=>new Date(t).toLocaleString('en-GB',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'});

function seedAll(){

function mdSubmit(e){
  e.preventDefault();const f=e.target,k=f.dataset.k,id=f.dataset.id,R=RES[k],row=id?resArr(k).find(x=>x.id===id):null;
  f.querySelectorAll('.fld.bad').forEach(x=>{x.classList.remove('bad');const m=x.querySelector('.err');if(m)m.remove()});
  const sup=row?row.supplier:(isOp()&&!R.global?f.querySelector('#mf-sup').value:(R.global?null:'s1'));const data={};let ok=true;
  const bad=(key,m)=>{ok=false;const fl=f.querySelector('#mf-'+key).closest('.fld');if(!fl.classList.contains('bad')){fl.classList.add('bad');fl.insertAdjacentHTML('beforeend','<span class="err">'+m+'</span>')}};
  R.f.forEach(fd=>{if(fd.t==='imgs'){data[fd.k]=(S.mdImgs||[]).slice();return}let v=f.querySelector('#mf-'+fd.k).value.trim();if(fd.t==='list'){data[fd.k]=v.split('\n').map(x=>x.trim()).filter(Boolean);return}if(fd.t==='num'){if(v==='')v=null;else v=Number(v)}data[fd.k]=v});
  R.f.forEach(fd=>{const v=data[fd.k];if(fd.t==='imgs')return;if(fd.t==='list'){if(v.length>fd.max)bad(fd.k,'At most '+fd.max+' lines');else if(v.some(x=>x.length>120))bad(fd.k,'Each line can be at most 120 characters');return}if(fd.t==='area'&&v&&v.length>fd.max)return bad(fd.k,'At most '+fd.max+' characters');if(fd.req&&(v===null||v===''))return bad(fd.k,'This field is required');if(v===null||v==='')return;
    if(fd.t==='num'){if(fd.min!=null&&v<fd.min)return bad(fd.k,'Must be at least '+fd.min);if(fd.max!=null&&v>fd.max)return bad(fd.k,'Must be at most '+fd.max)}
    if(fd.max!=null&&fd.t!=='num'&&String(v).length>fd.max)return bad(fd.k,'At most '+fd.max+' characters');
    if(fd.t==='email'&&!/^\S+@\S+\.\S+$/.test(v))return bad(fd.k,'Enter a valid email');
    if(fd.t==='ref'){const t=resArr(fd.to).find(x=>x.id===v);if(t&&t.supplier&&sup&&t.supplier!==sup)return bad(fd.k,'This belongs to another supplier')}
    if(fd.val){const m=fd.val(v,data);if(m)return bad(fd.k,m)}
    if(fd.uniq&&resArr(k).some(o=>o!==row&&(o.supplier||null)===(sup||null)&&String(o[fd.k]).toLowerCase()===String(v).toLowerCase()))return bad(fd.k,'This '+fd.l.toLowerCase()+' is already used'+(resArr(k).some(o=>o!==row&&o.deleted&&String(o[fd.k]).toLowerCase()===String(v).toLowerCase())?' by a deleted record. Restore it instead.':'.'))});
  if(!ok)return;
  if(row){Object.assign(row,data);auditLog('UPDATE',R.one,data.name||data.code||data.plate||row.id)}
  else{const n=Object.assign({id:mid(k.slice(0,2)),status:'ACTIVE',deleted:false},data);if(sup)n.supplier=sup;
    if(k==='taxes'&&!n.applies)n.applies='ALL';if(k==='rooms'){n.hotel=n.hotel||'h1';n.maxAdults=n.max;S.INV[n.id]={};for(let i=0;i<14;i++)S.INV[n.id][dayN(i)]={total:n.units,stop:false}}
    if(k==='trips'){n.adult=0;n.child=0}
    resArr(k).push(n);auditLog('CREATE',R.one,data.name||data.code||data.plate||n.id)}
  closeOv('ov-md');toast(R.one[0].toUpperCase()+R.one.slice(1)+(row?' saved':' created'));render();
}

function doLogin(e){
  e.preventDefault();const em=$('#le').value.trim().toLowerCase(),pw=$('#lp').value;LOGIN.email=em;
  if(!em||!pw){LOGIN.err='Enter your email and password.';return render()}
  const u=S.users.find(x=>x.email===em),generic='Wrong email or password.';
  if(u&&u.status==='LOCKED'){LOGIN.err='This account is locked after too many attempts. Try again in 15 minutes or ask an admin to reset it.';return render()}
  if(!u||u.pw!==pw){if(u){u.fails++;if(u.fails>=S.plat.lock){u.status='LOCKED';LOGIN.err='Too many attempts. The account is locked for 15 minutes.';return render()}}LOGIN.err=generic+(u?' '+(S.plat.lock-u.fails)+' attempt(s) left.':'');return render()}
  if(u.status==='SUSPENDED'){LOGIN.err='This account is suspended. Contact your admin.';return render()}
  if(u.sup&&S.sup.find(s=>s.id===u.sup).status!=='ACTIVE'){LOGIN.err='Your supplier account is suspended.';return render()}
  u.fails=0;u.last=Date.now();S.user=u;S.role=u.role;LOGIN.err='';auditLog('LOGIN','User',u.email);S.page='dashboard';location.hash='dashboard';root.innerHTML='';render();
  if(u.must){pwDlg(true)}
}

  if(w==='password'){if(v('pw0')!==S.user.pw)return toast('The current password is wrong',1);const m=pwErr(v('pw1'));if(m)return toast('New password: '+m.toLowerCase(),1);if(v('pw1')!==v('pw2'))return toast('The two new passwords do not match',1);if(v('pw1')===S.user.pw)return toast('Choose a different password',1);S.user.pw=v('pw1');S.user.must=false;auditLog('PASSWORD','User',S.user.email);toast('Password changed. Other devices are signed out.');render()}
  if(w==='business'){const em=v('bz-email');if(!v('bz-name').trim())return toast('Business name is required',1);if(em&&!/^\S+@\S+\.\S+$/.test(em))return toast('Enter a valid email',1);Object.assign(S.biz,{stars:$('#bz-stars')?Number(v('bz-stars')):S.biz.stars,name:v('bz-name'),legal:v('bz-legal'),email:em,phone:v('bz-phone'),tax:v('bz-tax'),country:v('bz-cty'),address:v('bz-addr')});auditLog('UPDATE','Business profile',S.biz.name);toast('Business profile saved')}
  if(w==='logo')toast('Upload works in the real app (stored with the media library).');

}

document.addEventListener('input',e=>{const f=e.target.closest('.fld.bad');if(f){f.classList.remove('bad');const m=f.querySelector('.err');if(m)m.remove()}});
document.addEventListener('submit',e=>{if(e.target.id==='nf')submitNew(e);else if(e.target.id==='lf')doLogin(e);else if(e.target.id==='mdform')mdSubmit(e)});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if($('#ov-dlg'))closeOv('ov-dlg');else if($('#ov-md'))closeOv('ov-md');else if($('#ov-new'))closeOv('ov-new');else if($('#ov-detail'))closeDetail()}});
addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(S.user&&PAGES[h]&&h!==S.page){S.page=h;render()}});
render();

</script>
