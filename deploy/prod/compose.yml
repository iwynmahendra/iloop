# Production on the Hostinger VPS: app + Caddy (automatic HTTPS). Database and storage are Supabase.
# Run only by deploy/prod/deploy.sh. IMAGE is set by CI; every other value is in /opt/iloop/.env on the VPS (not in git).
services:
  migrate:
    image: ${IMAGE:?}
    profiles: ["migrate"]
    env_file: .env
    command: ["npx", "prisma", "migrate", "deploy"]
    restart: "no"

  app:
    image: ${IMAGE:?}
    container_name: iloop-app
    env_file: .env
    restart: unless-stopped
    expose: ["4000"]

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on: [app]

volumes:
  caddy_data:
